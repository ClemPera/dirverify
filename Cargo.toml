[package]
name = "dirverify"
version = "0.0.0"
edition = "2024"
description = "Verify that two directory trees are identical, reporting only the differences"
license = "MIT"
repository = "https://github.com/ClemPera/dirverify"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
