[package]
name = "dirverify"
version = "0.1.0"
edition = "2024"
description = "Verify two directory trees match: cheap size pass, then byte-exact pass"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
